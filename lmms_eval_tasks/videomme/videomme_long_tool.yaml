task: videomme_long_reward_tool
doc_to_text: !function utils.videomme_doc_to_text
doc_to_messages: !function utils.videomme_tool_doc_to_messages
doc_to_target: "answer"
process_docs: !function utils.videmme_process_docs
include: _default_template_yaml
# Per-request cap. The stock tool yamls use 49152 (sized for the terse SFT'd
# LongVT multi-turn trace); zero-shot Qwen3-VL occasionally degenerates into a
# 49k-token repetition ramble on round 1 (~20 min/sample). 8192 bounds that;
# force_final_answer in the runner recovers the answer after any truncation.
generation_kwargs:
  max_new_tokens: 8192
